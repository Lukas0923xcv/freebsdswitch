name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: unit, API and web UI tests (simulator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: web UI build is up to date
        run: |
          make web
          git diff --exit-code -- internal/webui/dist || (echo "run 'make web' and commit internal/webui/dist"; exit 1)
      - run: make test
      - run: make freebsd
      - name: Playwright e2e
        run: |
          cd tests/e2e && npm ci && npx playwright install --with-deps chromium && cd ../..
          make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: tests/e2e/test-results }
      - uses: actions/upload-artifact@v4
        with: { name: freebsd-binaries, path: build/bsdswitch-freebsd-* }

  freebsd:
    name: FreeBSD 15.1 VM (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [pkg, lab-test]   # package build / integration tests (epair + VNET jails)
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # git describe -> package version
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          usesh: true
          prepare: pkg install -y go git gmake
          copyback: ${{ matrix.target == 'pkg' }}
          run: |
            set -e
            git config --global --add safe.directory "$PWD"
            gmake build ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'pkg'
        with: { name: freebsd-pkg, path: dist/*.pkg }

  iso:
    name: installer ISO
    # runs once the package exists, even if the integration tests failed
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: freebsd
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: freebsd-pkg, path: dist }
      - run: sudo apt-get update && sudo apt-get install -y xorriso qemu-system-x86 ovmf
      - run: sudo sh iso/build-iso.sh -p "$(ls dist/bsdswitch-*.pkg | head -1)" -v 15.1 -o dist
      - name: boot smoke test (UEFI, QEMU) - stops as soon as the installer is up
        run: |
          sudo chmod a+r dist/*.iso
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          qemu-system-x86_64 -m 2048 -display none -no-reboot \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -cdrom dist/*.iso -serial file:boot.log &
          qemu=$!
          for i in $(seq 240); do grep -a -q 'Welcome to FreeBSD' boot.log 2>/dev/null && break; sleep 1; done
          kill $qemu || true
          grep -a -E 'EFI loader|FreeBSD 1[0-9]\.|Welcome to FreeBSD' boot.log | head -5
          grep -a -q 'Welcome to FreeBSD' boot.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: boot-log, path: boot.log }
      - uses: actions/upload-artifact@v4
        with: { name: bsdswitch-iso, path: dist/*.iso, compression-level: 0 }
